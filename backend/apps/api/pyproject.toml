[project]
name = "dmc-api"
version = "0.1.0"
description = "FastAPI app: settings, error mapping, router wiring"
requires-python = ">=3.12"
dependencies = ["dmc-common", "dmc-platform", "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic-settings>=2"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
dmc-common = { workspace = true }
dmc-platform = { workspace = true }
