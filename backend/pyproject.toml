[project]
name = "dmc-backend"
version = "0.1.0"
description = "DMC backend: FastAPI app with a shared core and one package per domain module"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2",
    "pydantic-settings>=2",
    "sqlalchemy>=2.0.40",
    "psycopg[binary]>=3.2",
    "alembic>=1.15",
]

[project.scripts]
dmc-migrate = "app.core.migrations:main"
dmc-seed = "app.seed:main"

[dependency-groups]
dev = ["pytest", "httpx", "ruff", "import-linter"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.importlinter]
root_packages = ["app"]

[[tool.importlinter.contracts]]
name = "Core never imports modules; only the app wires them"
type = "layers"
layers = ["app.openapi", "app.main", "app.seed", "app.modules", "app.core"]

[[tool.importlinter.contracts]]
name = "Modules reach each other only through service.py"
type = "protected"
protected_modules = ["app.modules.*"]
allowed_importers = ["app.main", "app.seed"]
ignore_imports = ["app.modules.** -> app.modules.*.service"]
unmatched_ignore_imports_alerting = "none"
