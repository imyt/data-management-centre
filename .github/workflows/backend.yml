name: backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "contracts/**"
      - "infra/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "contracts/**"
      - "infra/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # The same Postgres 18, roles and databases as local development (infra/compose.yaml).
      DMC_TEST_DATABASE_URL: postgresql+psycopg://dmc_app:dmc_app@localhost:5432/dmc_test
      DMC_TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://dmc_migrator:dmc_migrator@localhost:5432/dmc_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Start Postgres
        working-directory: infra
        run: docker compose up -d --wait db
      - uses: astral-sh/setup-uv@v10.3.0 # setup-uv publishes no moving major tag
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run lint-imports
      - run: uv run pytest
      - name: OpenAPI contract is up to date
        run: uv run python scripts/export_openapi.py --check
