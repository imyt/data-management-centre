services:
  db:
    image: postgres:18-alpine
    container_name: governance_db
    restart: always
    environment:
      POSTGRES_DB: governance_center
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d governance_center"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
