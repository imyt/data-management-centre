minimumReleaseAgeExclude:
  - '@tanstack/react-virtual@3.14.21'
  - '@tanstack/virtual-core@3.19.6'
  - lucide-react@1.58.0
permissions:
  '@tanstack/react-table':
    skills: true
# pnpm 12 links approved agent skills into an agent's directory, which it detects from the
# environment. CI has no agent, so name the directory: the install fails without one.
skills:
  dirs:
    - .claude/skills
