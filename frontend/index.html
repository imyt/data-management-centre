<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Management Centre</title>
    <script>
      // Apply the saved theme and density before first paint, so there is no flash or colour transition.
      try {
        if (localStorage.getItem("dmc-theme") === "dark") document.documentElement.classList.add("dark")
        if (localStorage.getItem("dmc-density") === "compact") document.documentElement.dataset.density = "compact"
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
